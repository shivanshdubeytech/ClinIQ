name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Tests
        env:
          GROQ_API_KEY: ci_test_key_not_used
        run: pytest tests/ -v --cov=src --cov=app --cov-report=term
      - name: Secret scan
        run: |
          ! grep -rInE 'gsk_[A-Za-z0-9]{20,}' --exclude-dir=.git --exclude-dir=venv .
