services:
  - type: web
    name: cliniq
    runtime: python
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    disk:
      name: cliniq-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: llama-3.1-8b-instant
      - key: SQLITE_DB_PATH
        value: /data/cliniq.db
      - key: CHROMA_DB_PATH
        value: /data/chroma_db
      - key: AUDIO_DIR
        value: /data/audio
      - key: LOG_LEVEL
        value: INFO
      - key: FLASK_DEBUG
        value: 0
