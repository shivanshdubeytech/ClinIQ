# ClinIQ reverse proxy. Terminates TLS and forwards to gunicorn on loopback.
# Replace example.invalid with the real hostname and the certificate paths
# with the provisioned ones. See DEPLOYMENT_BLOCKERS.md item 1.5.
#
# NOTE: proxy_read_timeout (200s) must exceed gunicorn timeout (180s in gunicorn.conf.py).
# Both values derive from the performance measurements and slowest OCR pipeline limits.

server {
    listen 80;
    listen [::]:80;
    server_name example.invalid;
    # Redirect all plaintext traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.invalid;

    ssl_certificate     /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Match MAX_CONTENT_LENGTH in app.py (§2a). Keep these two in sync.
    client_max_body_size 20m;
    client_body_timeout  30s;

    # Never log query strings or request bodies for this application.
    # Patient text appears in neither, but filenames appear in the path.
    access_log /var/log/nginx/cliniq.access.log combined;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /static/ {
        alias /srv/cliniq/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 200s;   # must exceed gunicorn timeout (§9a)
        proxy_send_timeout 200s;
        proxy_buffering off;       # audio responses should stream
    }
}
